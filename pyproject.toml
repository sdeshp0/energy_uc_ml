[project]
name = "ucsim"
version = "0.2.0"
description = "Unit commitment simulation under configurable scenarios and time frames"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pyomo>=6.7",
    "highspy>=1.7",
    "pyyaml>=6.0",
    "streamlit>=1.46",
    "altair>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ucsim"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
