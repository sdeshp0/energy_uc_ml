[project]
name = "energy-uc-ml"
version = "0.1.0"
description = "ML-forecast-driven unit commitment: renewable forecasting + MILP optimization for a diversified generation fleet"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "streamlit>=1.30",
]

[project.optional-dependencies]
# Phase 2: stochastic / rolling-horizon UC migrates from scipy.optimize.milp to Pyomo
phase2 = [
    "pyomo>=6.7",
    "highspy>=1.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
package = false
